name: web

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    env:
      # Fixture mock only; no provider credentials exist in CI.
      NEXT_PUBLIC_API_MODE: mock
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci

      - name: Shared fixtures match contracts/examples
        run: |
          npm run sync:fixtures
          test -z "$(git status --porcelain -- mocks/fixtures)" || { git status --porcelain -- mocks/fixtures; echo "Run npm run sync:fixtures"; exit 1; }

      - name: Generated API types match contracts/openapi.json
        run: |
          npm run generate:api
          test -z "$(git status --porcelain -- lib/api/generated.ts)" || { git diff -- lib/api/generated.ts | head -50; echo "Run npm run generate:api"; exit 1; }

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: "true"

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
